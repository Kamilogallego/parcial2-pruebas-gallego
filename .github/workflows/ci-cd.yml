# Pipeline de integración y despliegue continuos del parcial.
# Lo entrega el docente completo: no hace falta modificarlo.
# Cada job corre en su propia máquina virtual (runner). El despliegue,
# que es simulado, solo corre si los cuatro jobs de verificación pasan.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analisis-estatico:
    name: Análisis estático
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Análisis estático
        run: npm run lint

  pruebas-unitarias:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pruebas unitarias
        run: npm run test:unit

  pruebas-bdd:
    name: Pruebas BDD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pruebas BDD
        run: npm run test:bdd

  cobertura:
    name: Cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cobertura
        run: npm run test:cobertura


  despliegue:
    name: Despliegue (simulado)
    needs: [analisis-estatico, pruebas-unitarias, pruebas-bdd, cobertura]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar
        run: |
          echo "Versión: ${{ github.sha }}"
          echo "Desplegado"
